<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ghost Survival</title>
<meta name="description" content="Survive until the night is over. A dark fantasy survival game for phones and the browser.">
<meta name="theme-color" content="#06090d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="TemplateData/favicon.png">
<link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ghost Survival">
<link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>

<main id="landing" class="screen" hidden>
  <div class="card">
    <img class="icon" src="TemplateData/icon-192.png" alt="">
    <h1>Ghost Survival</h1>
    <p class="tagline" id="tagline"></p>
    <div id="actions"></div>
    <p class="version">v1.14 · <a id="privacy" href="privacy.html"></a></p>
  </div>
</main>

<div id="loading" class="screen" hidden>
  <div class="card">
    <img class="icon" src="TemplateData/icon-192.png" alt="">
    <p class="loading-title" id="loading-title"></p>
    <div class="bar"><div id="bar-fill"></div></div>
    <p class="note" id="loading-pct">0%</p>
  </div>
</div>

<div id="error" class="screen" hidden>
  <div class="card">
    <h2 id="error-title"></h2>
    <p class="note" id="error-text"></p>
    <button class="btn" id="retry" type="button"></button>
  </div>
</div>

<script>
(function () {
  "use strict";
  // Android players get the app from the release; iPhones play this page and keep it as a home-screen app.
  var APK_URL = "https://github.com/mehmetrooki/ghost-survival/releases/latest/download/GhostSurvival.apk";
  var BUILD_MB = "57", APK_MB = "116";
  var SHARE = '<svg class="share" viewBox="0 0 20 24" aria-hidden="true"><path d="M10 2v13M5.5 6.5 10 2l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10H3v12h14V10h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  var TEXT = {
    en: {
      tagline: "Survive until the night is over",
      play: "PLAY",
      playBrowser: "PLAY IN BROWSER",
      android: "DOWNLOAD FOR ANDROID",
      androidApk: "Android app (APK)",
      androidNote: "Open the downloaded file and tap Install. If Android asks, allow installs from this browser.",
      iosTitle: "Install on iPhone",
      iosSteps: "Tap <b>Share</b> " + SHARE + " and choose <b>Add to Home Screen</b>. The game then opens full screen from its own icon. New versions arrive by themselves: keep the same icon, because removing it and adding it again starts a new save.",
      browserSize: "The browser version downloads about %MB% MB the first time, then starts from the cache.",
      apkSize: "About %MB% MB.",
      loading: "Loading the night...",
      starting: "Lighting the braziers...",
      errorTitle: "The game could not start",
      network: "A game file could not be downloaded. Check the connection and try again.",
      retry: "TRY AGAIN",
      privacy: "Privacy"
    },
    tr: {
      tagline: "Gece bitene kadar hayatta kal",
      play: "OYNA",
      playBrowser: "TARAYICIDA OYNA",
      android: "ANDROID İÇİN İNDİR",
      androidApk: "Android uygulaması (APK)",
      androidNote: "İnen dosyayı açıp Yükle'ye dokun. Android sorarsa bu tarayıcıdan yüklemeye izin ver.",
      iosTitle: "iPhone'a kur",
      iosSteps: "<b>Paylaş</b> " + SHARE + " düğmesine dokun ve <b>Ana Ekrana Ekle</b>'yi seç. Oyun bundan sonra kendi simgesinden tam ekran açılır. Yeni sürümler kendiliğinden gelir; hep aynı simgeyi kullan, çünkü simgeyi silip yeniden eklemek yeni bir kayıtla başlatır.",
      browserSize: "Tarayıcı sürümü ilk seferde yaklaşık %MB% MB indirir, sonra önbellekten açılır.",
      apkSize: "Yaklaşık %MB% MB.",
      loading: "Gece yükleniyor...",
      starting: "Mangallar yakılıyor...",
      errorTitle: "Oyun başlatılamadı",
      network: "Bir oyun dosyası indirilemedi. Bağlantını kontrol edip tekrar dene.",
      retry: "TEKRAR DENE",
      privacy: "Gizlilik"
    }
  };
  var lang = /^tr\b/i.test(navigator.language || "") ? "tr" : "en";
  var t = TEXT[lang];
  document.documentElement.lang = lang;

  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches;

  function $(id) { return document.getElementById(id); }
  var canvas = $("unity-canvas"), landing = $("landing"), loading = $("loading"), actions = $("actions");
  $("tagline").textContent = t.tagline;
  $("loading-title").textContent = t.loading;
  $("error-title").textContent = t.errorTitle;
  $("retry").textContent = t.retry;
  $("privacy").textContent = t.privacy;
  $("privacy").href = "privacy.html#" + lang;
  $("retry").addEventListener("click", function () { location.reload(); });

  function known(value) { return value.indexOf("%") < 0; }
  function button(label, secondary, onClick, href) {
    var el = document.createElement(href ? "a" : "button");
    el.className = "btn" + (secondary ? " secondary" : "");
    el.textContent = label;
    if (href) el.href = href; else el.type = "button";
    if (onClick) el.addEventListener("click", onClick);
    actions.appendChild(el);
  }
  function note(html) {
    var p = document.createElement("p");
    p.className = "note";
    p.innerHTML = html;
    actions.appendChild(p);
  }
  function howto(title, html) {
    var box = document.createElement("div");
    box.className = "howto";
    box.innerHTML = "<h2>" + title + "</h2><p>" + html + "</p>";
    actions.appendChild(box);
  }
  var browserSize = known(BUILD_MB) ? t.browserSize.replace("%MB%", BUILD_MB) : "";
  var apkSize = known(APK_MB) ? " " + t.apkSize.replace("%MB%", APK_MB) : "";

  if (isAndroid) {
    button(t.android, false, null, APK_URL);
    note(t.androidNote + apkSize);
    button(t.playBrowser, true, start);
    if (browserSize) note(browserSize);
  } else if (isIOS) {
    button(t.play, false, start);
    if (browserSize) note(browserSize);
    howto(t.iosTitle, t.iosSteps);
  } else {
    button(t.playBrowser, false, start);
    if (browserSize) note(browserSize);
    button(t.androidApk, true, null, APK_URL);
  }

  var buildUrl = "Build";
  var config = {
    dataUrl: buildUrl + "/c884bc2397923c00616c9c91ce3c2cad.data.unityweb",
    frameworkUrl: buildUrl + "/e36a2238d31bdaaa79632b8b6aafef4d.framework.js.unityweb",
    codeUrl: buildUrl + "/2742ece4b13773a5da45a73509bd8ad0.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "GhostSurvival",
    productVersion: "1.14",
    // full device resolution costs a lot of fill rate on 3x phone screens; 2x stays sharp
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    showBanner: function (message, type) { if (type === "error") fail(message); else console.warn(message); },
    // a sound the browser cannot decode only goes silent; it must not stop the game with Unity's error dialog
    errorHandler: function (message) {
      if (!/EncodingError|Decoding failed|decodeAudioData|Decode error/i.test(String(message))) return false;
      console.warn("Sound skipped: " + message);
      return true;
    }
  };

  var started = false;
  function start() {
    if (started) return;
    started = true;
    landing.hidden = true;
    loading.hidden = false;
    document.body.classList.add("playing");
    var root = document.documentElement;
    if (isAndroid && root.requestFullscreen) {
      // the game lays itself out for whichever way the phone is held, so the screen is not locked sideways
      root.requestFullscreen({ navigationUI: "hide" }).catch(function () {});
    }
    var script = document.createElement("script");
    script.src = buildUrl + "/f9494e3ea9525f4c36a31b20648e2cf8.loader.js";
    script.onload = function () {
      // ask the browser to keep this page's storage (the save) even when the phone runs short of space
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { }); } catch (e) { }
      createUnityInstance(canvas, config, function (progress) {
        var pct = Math.round(progress * 100);
        $("bar-fill").style.width = pct + "%";
        $("loading-pct").textContent = pct + "%";
        if (progress >= 0.9) $("loading-title").textContent = t.starting;
      }).then(function () {
        loading.hidden = true;
        canvas.focus();
      }).catch(fail);
    };
    script.onerror = function () { fail(t.network); };
    document.body.appendChild(script);
  }

  function fail(message) {
    loading.hidden = true;
    landing.hidden = true;
    $("error-text").textContent = String(message && message.message || message || t.network);
    $("error").hidden = false;
  }

  // opened from the home-screen icon: go straight into the game
  if (standalone) start(); else landing.hidden = false;
})();
</script>
</body>
</html>
